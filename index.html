<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punch The Bag - Write & Fight</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <h1 class="titulo-tinta">Write & Fight</h1>

    <div class="container">
      <div class="game-area">
        <div class="enemy-container">
          <div class="enemy-health">
            <div class="health-bar" id="enemy-health-bar"></div>
          </div>
          <div class="enemy-timer">
            <img id="enemy-img" src="enemy.png" alt="Enemigo">
          </div>
        </div>
        
        <div class="player-health">
          <div class="health-bar" id="player-health-bar"></div>
        </div>
        
        <div class="word-section">
          <div id="word-display">PALABRA</div>
          <input type="text" id="word-input" placeholder="Escribe...">
        </div>
      </div>

      <div class="leaderboard"></div>
    </div>
  </body>
</html>
